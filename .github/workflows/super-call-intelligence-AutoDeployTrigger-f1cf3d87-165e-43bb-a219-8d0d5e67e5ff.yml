name: Trigger auto deployment for super-call-intelligence

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ Mic-capture-using-chrome-screen-share ]
    paths:
    - '**'
    - '.github/workflows/super-call-intelligence-AutoDeployTrigger-f1cf3d87-165e-43bb-a219-8d0d5e67e5ff.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SUPERCALLINTELLIGENCE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SUPERCALLINTELLIGENCE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SUPERCALLINTELLIGENCE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.SUPERCALLINTELLIGENCE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SUPERCALLINTELLIGENCE_REGISTRY_PASSWORD }}
          containerAppName: super-call-intelligence
          resourceGroup: call-intelligence-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


